name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run check

      - name: Build package
        run: npm run build

      - name: Verify server imports and React rendering
        run: npm run test:package

      - name: Check bundle size
        run: npm run check:size

      - name: Install browser test engines
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Start virtual audio output
        run: |
          sudo apt-get install -y pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=playwright
          pactl set-default-sink playwright

      - name: Browser tests
        run: npm run test:browser

      - name: Retain browser failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore

      - name: Build examples
        run: npm run check:examples && npm run demo:build && npm run example:react:build

      - name: Typecheck docs
        run: npm run typecheck --workspace website

      - name: Build docs
        run: npm run docs:build

  react18:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false --ignore-scripts react@18 react-dom@18
      - run: npm test && npm run test:package
